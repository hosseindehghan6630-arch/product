<!DOCTYPE html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جستجوی کالا</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b202b;--tx:#e8eaf0;--mut:#9aa3b2;--bd:#2c3342}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.w{max-width:1000px;margin:0 auto;padding:20px 14px}
h1{font-size:20px;margin:6px 0 14px}
input[type=search],textarea{width:100%;padding:13px 14px;font:inherit;font-size:17px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
input:focus,textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:10px}
#out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
#out .card{margin-top:0}
#out .no{grid-column:1/-1}
@media(max-width:560px){#out{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:380px){#out{grid-template-columns:1fr}}
.nm{font-weight:700}
.mt{color:var(--mut);font-size:13px}
.codes{font-size:13px;direction:ltr;text-align:right;color:var(--mut)}
.no{color:var(--bad);font-weight:700;text-align:center;padding:18px}
.ex{border-inline-start:4px solid var(--ok)}
.hint{color:var(--mut);font-size:13px;margin-top:8px}
button{font:inherit;padding:9px 16px;border:0;border-radius:10px;background:var(--pri);color:#fff;cursor:pointer;margin:6px 0 0 6px}
input[type=text]{width:100%;padding:10px 12px;font:inherit;font-size:15px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
#out .card{cursor:pointer;display:flex;gap:10px;align-items:flex-start}
#out .no{display:block;cursor:default}
.chk{width:20px;height:20px;margin-top:4px;flex:none;accent-color:var(--pri)}
.card.sl{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,var(--card))}
.addbox{margin-top:12px;text-align:right;font-weight:400}
.addbox button{margin-inline-start:0}
#sel{display:none}
#sel .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
#sel .row:last-child{border-bottom:0}
#sel .x{background:transparent;color:var(--bad);padding:2px 10px;margin:0;font-size:18px}
.tag{font-size:12px;color:var(--bad);margin-inline-start:6px}
#sel .bar button{margin-inline-end:6px}
.g{background:var(--mut)!important}
#admin textarea{height:130px;font-size:13px}
</style>
</head>
<body>
<div class="w">
  <h1>جستجوی کالا</h1>
  <div id="admin" class="card" style="display:none">
    <b>تنظیم اولیه (فقط شما)</b>
    <div class="hint">لیست را از اکسل کپی کنید (ستون‌ها: گروه، دسته، زیردسته، کد۱، کد۲، نام کالا، ...) و اینجا بچسبانید.</div>
    <textarea id="paste" placeholder="لیست کالاها را اینجا Paste کنید"></textarea>
    <button onclick="loadPaste()">بارگذاری</button>
    <button id="exp" onclick="exportPage()" style="display: inline-block; background: var(--ok);">دانلود نسخه آماده برای سوپرمارکت</button>
    <span id="cnt" class="mt">2952 کالا بارگذاری شد</span>
  </div>
  <input id="q" type="search" placeholder="نام کالا را بنویسید، مثلاً: چای ارل گری" autocomplete="off" autofocus="">
  <div id="sel" class="card" style="display: none;">
    <b>لیست انتخاب‌شده (<span id="sc">0</span>)</b>
    <div id="sellist"></div>
    <div class="bar">
      <button onclick="copySel()">کپی (برای اکسل)</button>
      <button onclick="dlSel()" style="background:var(--ok)">دانلود فایل اکسل (CSV)</button>
      <button onclick="clearSel()" class="g">پاک کردن لیست</button>
      <span id="msg" class="mt"></span>
    </div>
  </div>
  <div id="out"></div>
  <div class="hint">کالاهای مشابه از لیست نمایش داده می‌شود. اگر چیزی پیدا نشود، «موجود نیست» نشان داده می‌شود.</div>
</div>

<script>
let items=[];
const norm=s=>String(s||'')
 .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
 .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
 .replace(/ي|ى/g,'ی').replace(/ك/g,'ک').replace(/ۀ|ة/g,'ه')
 .replace(/[ءَُِّْٰ]/g,'').replace(/[\u200c\u200f]/g,' ').replace(/[()\-_\/\\.,،:؛"'«»]/g,' ')
 .toLowerCase().replace(/\s+/g,' ').trim();
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=0;j<=b.length;j++)m[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
function parse(raw){
 items=[];
 raw.split(/\r?\n/).forEach(l=>{
  const c=l.split('\t'); if(c.length<6||!c[5].trim())return;
  const name=c[5].trim(), n=norm(name);
  items.push({id:items.length,name,cat:c[1]?.trim(),sub:c[2]?.trim(),c1:c[3]?.trim(),c2:c[4]?.trim(),n,c:n.replace(/ /g,''),w:n.split(' ')});
 });
 document.getElementById('cnt').textContent=items.length+' کالا بارگذاری شد';
}
function search(q){
 const nq=norm(q); if(!nq)return null;
 const toks=nq.split(' '), cq=nq.replace(/ /g,'');
 const res=[];
 for(const it of items){
  let s=0,txt=0,hit=0;
  for(const t of toks){
   const isNum=/^\d+$/.test(t);
   if(it.c.includes(t)){s+=1;hit++;if(!isNum)txt++;}
   else if(t.length>=4&&it.w.some(w=>lev(w,t)<=1)){s+=.7;hit++;txt++;}
  }
  if(txt===0)continue;
  s=s/toks.length;
  if(it.c.includes(cq))s+=1;
  if(s>=0.6)res.push({it,s:s-it.n.length/1000});
 }
 res.sort((a,b)=>b.s-a.s);
 return res.map(r=>r.it);
}
let sel=[];
function renderSel(){
 const box=document.getElementById('sel'),l=document.getElementById('sellist');
 box.style.display=sel.length?'block':'none';
 document.getElementById('sc').textContent=sel.length;
 l.innerHTML='';
 sel.forEach((it,k)=>{
  const r=document.createElement('div');r.className='row';
  const t=document.createElement('div');
  const n=document.createElement('span');n.textContent=it.name;t.appendChild(n);
  if(it.custom){const g=document.createElement('span');g.className='tag';g.textContent='موجود نیست (تایپ‌شده)';t.appendChild(g);}
  const x=document.createElement('button');x.className='x';x.textContent='×';x.title='حذف';
  x.onclick=()=>{sel.splice(k,1);renderSel();render();};
  r.appendChild(t);r.appendChild(x);l.appendChild(r);
 });
}
function toggle(i){const k=sel.findIndex(s=>s.id===i.id);if(k>=0)sel.splice(k,1);else sel.push(i);renderSel();}
function addCustom(){
 const v=document.getElementById('cust').value.trim();if(!v)return;
 if(!sel.some(s=>s.custom&&norm(s.name)===norm(v)))sel.push({id:'c'+Date.now(),name:v,custom:true});
 renderSel();const q=document.getElementById('q');q.value='';render();q.focus();
}
function rows(){
 return [['نام کالا','کد۱','کد۲','دسته','زیردسته','وضعیت']].concat(sel.map(s=>[s.name,s.c1||'',s.c2||'',s.cat||'',s.sub||'',s.custom?'موجود نیست':'موجود']));
}
function flash(t){const m=document.getElementById('msg');m.textContent=t;setTimeout(()=>m.textContent='',2500);}
function copySel(){
 const t=rows().map(r=>r.join('\t')).join('\n');
 const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();flash('کپی شد');};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>flash('کپی شد'),fb);else fb();
}
function dlSel(){
 const csv='\ufeff'+rows().map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='selected_products.csv';a.click();
}
function clearSel(){if(sel.length&&confirm('لیست پاک شود؟')){sel=[];renderSel();render();}}
function render(){
 const q=document.getElementById('q').value, out=document.getElementById('out');
 const r=search(q);
 if(r===null){out.innerHTML='';return;}
 if(!r.length){
  out.innerHTML='<div class="card no">موجود نیست<div class="addbox"><div class="mt">می‌توانید نام کالا را تایپ کنید و به لیست اضافه کنید:</div><input id="cust" type="text" placeholder="نام کالا"><button onclick="addCustom()">افزودن به لیست</button></div></div>';
  const c=document.getElementById('cust');c.value=q;
  c.addEventListener('keydown',e=>{if(e.key==='Enter')addCustom();});
  return;
 }
 out.innerHTML='';
 r.forEach((i,k)=>{
  const on=sel.some(s=>s.id===i.id);
  const d=document.createElement('div');d.className='card'+(k==0?' ex':'')+(on?' sl':'');
  d.innerHTML='<input type="checkbox" class="chk"><div><div class="nm"></div><div class="mt"></div><div class="codes"></div></div>';
  const ck=d.firstChild;ck.checked=on;
  const b=d.lastChild;
  b.children[0].textContent=i.name;
  b.children[1].textContent=[i.cat,i.sub].filter(Boolean).join(' › ');
  b.children[2].textContent=[i.c1,i.c2].filter(Boolean).join(' | ');
  d.onclick=e=>{if(e.target!==ck)ck.checked=!ck.checked;toggle(i);d.classList.toggle('sl',ck.checked);};
  out.appendChild(d);
 });
}
document.getElementById('q').addEventListener('input',render);
function loadPaste(){const v=document.getElementById('paste').value;if(!v.trim())return;parse(v);document.getElementById('data').textContent=v;document.getElementById('exp').style.display='inline-block';render();}
function exportPage(){
 const clone=document.documentElement.cloneNode(true);
 clone.querySelector('#data').textContent=document.getElementById('data').textContent;
 clone.querySelector('#out').innerHTML='';
 clone.querySelector('#sellist').innerHTML='';clone.querySelector('#sel').style.display='none';
 clone.querySelector('#paste').textContent='';clone.querySelector('#admin').style.display='none';
 clone.querySelector('#q').removeAttribute('value');
 const html='<!DOCTYPE html>\n'+clone.outerHTML;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='product_lookup_ready.html';a.click();
}
(function(){const d=document.getElementById('data').textContent;
 const adm=/[?&#]admin\b/.test(location.search+location.hash);
 if(d.trim()){parse(d);}
 if(adm||!d.trim()){document.getElementById('admin').style.display='block';}})();
</script>
